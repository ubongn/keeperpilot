services:
  - type: web
    name: keeperpilot
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/src/index.js
    envVars:
      - key: KH_API_KEY
        sync: false
      - key: KH_DRY_RUN
        value: "false"
      - key: KH_NETWORK
        value: sepolia
      - key: KH_BASE_URL
        value: https://app.keeperhub.com
      - key: KH_WALLET_ADDRESS
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: PORT
        value: "3000"
